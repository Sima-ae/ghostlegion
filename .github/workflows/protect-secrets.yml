# Fail the build if someone tries to commit .env, SQL dumps, or other secrets.
name: Protect secret files

on:
  push:
  pull_request:

jobs:
  env-not-committed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Reject tracked .env / SQL dumps / credential files
        run: bash scripts/check-env-not-committed.sh
